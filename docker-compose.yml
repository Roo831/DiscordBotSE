services:
  discord-bot:
    image: roo831/discord-bot-se:latest
    pull_policy: always
    container_name: discord-bot-se
    restart: always
    env_file:
      - .env
    environment:
      - WATCHLIST_RECEIPTS_DIRECTORY=/app/logs
      - JAVA_TOOL_OPTIONS=-DsocksProxyHost=172.17.0.1 -DsocksProxyPort=1080
    volumes:
      - ./bot_logs:/app/logs