spring:
  application:
    name: DiscordBotService
  task:
    scheduling:
      pool:
        size: 2

discord:
  bot:
    token:
      engineers: ${DISCORD_ENGINEERS_API_KEY}
      rust: ${DISCORD_RUST_API_KEY}

backend:
  api:
    url: http://${SERVER_IP}:${SERVER_PORT}/api/v1/analytics
    key: ${SERVER_API_KEY}

watchlist:
  receipts-directory: ${WATCHLIST_RECEIPTS_DIRECTORY:./bot_logs}

logging:
  file:
    name: ${APPLICATION_LOG_FILE:./bot_logs/discord-bot.log}
